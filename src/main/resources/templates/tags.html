<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${attraction.name}"> Tags</title>
    <link rel="stylesheet" th:href="@{/common.css}">
    <link rel="stylesheet" th:href="@{/tagsStyle.css}">
</head>
<body>
<main>
    <div class="border">
        <h1 th:text="${attraction.name}"></h1>
        <hr>
        <p th:text="${attraction.description}"></p>
        <ul th:each="Tag : ${taglist}">
            <li th:text="${taglist}"></li>
<!--            Intet tag evalueres til at være sandt pt-->
            <li th:if="*{Tag == 'ARCHITECTURE'}">Arkitektur</li>
            <li th:if="${Tag == 'KID_FRIENDLY'}">Børnevenligt</li>
            <li th:if="*{Tag == 'AMUSEMENT_PARK'}">Forlystelsespark</li>
            <li th:if="*{Tag == 'HISTORY'}">Historie</li>
            <li th:if="*{Tag == 'ART'}">Kunst</li>
            <li th:if="*{Tag == 'MUSEUM'}">Museum</li>
            <li th:if="*{Tag == 'NATURE'}">Natur</li>
            <li th:if="*{Tag == 'CASTLE'}">Slot</li>
            <li th:if="*{Tag == 'ZOO'}">Zoologisk Have</li>
        </ul>
        <div class="button-right">
            <a th:href="@{/attractions}">
                <button type="button">Tilbage</button>
            </a>
        </div>
    </div>
</main>
</body>
</html>
